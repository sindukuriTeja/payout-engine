databases:
  - name: payout-db
    databaseName: payouts_db
    user: postgres
    plan: free

services:
  # 1. Redis for Celery
  - type: redis
    name: payout-redis
    plan: free
    ipAllowList: []

  # 2. Backend (Django API)
  - type: web
    name: payout-engine-backend
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: bash entrypoint.sh
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: payout-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: payout-redis
          type: redis
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: CONTRACT_ADDRESS
        sync: false
      - key: WEB3_PROVIDER_URL
        sync: false
      - key: PRIVATE_KEY
        sync: false

  # 3. Celery Worker
  - type: worker
    name: payout-engine-celery-worker
    runtime: docker
    plan: free
    rootDir: backend
    dockerfilePath: ./Dockerfile
    dockerCommand: celery -A payouts_engine worker -l info --concurrency=2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: payout-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: payout-redis
          type: redis
          property: connectionString
      - key: CONTRACT_ADDRESS
        sync: false
      - key: WEB3_PROVIDER_URL
        sync: false
      - key: PRIVATE_KEY
        sync: false

  # 4. Frontend (React Static Site)
  - type: web
    name: payout-engine-frontend
    runtime: static
    plan: free
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          name: payout-engine-backend
          type: web
          property: hostport
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
