databases:
  - name: payout-db
    databaseName: payouts_db
    user: postgres
    plan: free

services:
  # 1. Redis for Celery
  - type: redis
    name: payout-redis
    plan: free
    ipAllowList: []

  # 2. Backend + Frontend (single service)
  - type: web
    name: payout-engine
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: payout-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: payout-redis
          type: redis
          property: connectionString
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      - key: DJANGO_SECRET_KEY
        generateValue: true

  # 3. Celery Worker
  - type: worker
    name: payout-engine-celery-worker
    runtime: docker
    plan: free
    dockerfilePath: backend/Dockerfile
    dockerCommand: celery -A payouts_engine worker -l info --concurrency=2
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: payout-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: payout-redis
          type: redis
          property: connectionString
